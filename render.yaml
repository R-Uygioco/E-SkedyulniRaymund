services:
  - type: web
    name: eskedyul-admin-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn admin.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /admin/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: AUTO_CREATE_TABLES
        value: "false"
